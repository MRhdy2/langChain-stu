<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>布局标签学习</title>
    <style>
        .d1 {background: crimson}
        .d2 {background: aqua}
        .s1 {background: blue}
    </style>
</head>
<body>
        <!--
            div：大盒子的、 独占一行
            span：小盒子 一行可以多个
        -->
        <div class="d1">大盒子1</div> <div class="d2">大盒子2</div>
        <span class="s1">span1</span> <span>span2</span>
</body>
</html>
