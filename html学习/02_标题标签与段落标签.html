<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>标题段落标签学习</title>
</head>
<body>
    <!--
          标题格式: <h1>h1</h1> #一共有h1到h6，h1最大
          段落标签: <p>第一个段落</p>
                  <p>另外一个段落</p> #特点：独占一行，由语义化左右-浏览器知道你是段落
    -->
    <h1>我是h1</h1>
    <h2>我是h2</h2>
    <h3>我是h3</h3>
    <h4>我是h4</h4>
    <h5>我是h5</h5>
    <h6>我是h6</h6>

    <p>我是段落1</p>
    <p>我是段落2</p>
</body>
</html>
