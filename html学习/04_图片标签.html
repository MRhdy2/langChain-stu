<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>图片标签学习</title>
</head>
<body>
      <!--
          图片标签：img
          属性：src：图片路径
               title：图片介绍
               width：图片宽度
               height：图片高度
               alt：图片为加载提示
      -->
      <img src="img.png" title="篮球" width="600" height="300" alt="此处有一张与篮球有关的图片">
</body>
</html>
