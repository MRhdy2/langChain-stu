<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net.cn/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<h1>学生信息</h1>

<div class="row">
    <div class="col-md-8 offset-md-2">
        <a href="/add_student.html" class="btn btn-primary mb-3">添加学生</a>
        <table class="table table-bordered table-striped table-hover">
            <thead>
            <tr>
                <th>姓名</th>
                <th>学号</th>
                <th>班级</th>
            </tr>
            </thead>
            <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.name }}</td>
                <td>{{ student.sno }}</td>
                <td>{{ student.clas_id }}</td>
            </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
